<body class="bg-ink-950 text-ink-100 font-sans antialiased min-h-screen">

<script id="embedded-state" type="application/json">null</script>

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-40 bg-ink-950/90 backdrop-blur-xl border-b border-ink-800">
  <div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-ink-800 border border-ink-700 flex items-center justify-center">
        <svg class="w-4 h-4 text-ink-100" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h10.5m-10.5 10.5h10.5M3 12h18"/>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">Meus Treinos</h1>
        <p class="text-[11px] text-ink-400 leading-tight" id="headerSub">2 treinos por semana</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="downloadHtmlWithState()" class="text-[11px] font-semibold text-ink-300 hover:text-white px-3 py-1.5 rounded-lg border border-ink-800 hover:border-ink-700 transition">
        Salvar
      </button>
    </div>
  </div>
</header>

<!-- ================= SELETOR DE PERFIL ================= -->
<div class="max-w-2xl mx-auto px-5 pt-5">
  <div class="flex gap-2 p-1 rounded-xl bg-ink-900 border border-ink-800">
    <button onclick="setProfile('homem')" id="prof-homem" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all">
      Homem
    </button>
    <button onclick="setProfile('mulher')" id="prof-mulher" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all">
      Mulher
    </button>
  </div>
</div>

<!-- ================= ABAS ================= -->
<nav class="max-w-2xl mx-auto px-5 mt-5">
  <div class="flex gap-1 overflow-x-auto no-scrollbar">
    <button onclick="switchTab('treinos')" id="tab-btn-treinos" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition">Treinos</button>
    <button onclick="switchTab('progresso')" id="tab-btn-progresso" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition">Progresso</button>
    <button onclick="switchTab('dieta')" id="tab-btn-dieta" class="tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition">Dieta</button>
  </div>
</nav>

<!-- ================= CONTEÚDO ================= -->
<main class="max-w-2xl mx-auto px-5 py-6 pb-24 space-y-6">

  <!-- ============ ABA TREINOS ============ -->
  <section id="pane-treinos" class="pane space-y-6">
    <!-- Seletor de treino A/B -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="selectWorkout(0)" id="wbtn-0" class="wbtn py-3 rounded-xl text-sm font-bold transition">Treino A</button>
      <button onclick="selectWorkout(1)" id="wbtn-1" class="wbtn py-3 rounded-xl text-sm font-bold transition">Treino B</button>
    </div>

    <!-- Info do treino atual -->
    <div class="bg-ink-900 border border-ink-800 rounded-2xl p-5">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wider font-bold text-ink-400 mb-1" id="workoutLetter">Treino A</p>
          <h2 class="text-lg font-bold text-white leading-tight" id="workoutTitle">—</h2>
          <p class="text-xs text-ink-400 mt-1" id="workoutSubtitle">—</p>
        </div>
        <div class="shrink-0 text-right">
          <div class="text-2xl font-bold text-white leading-none" id="workoutProgressNum">0/6</div>
          <p class="text-[10px] text-ink-500 mt-1 uppercase tracking-wider font-semibold">feitos</p>
        </div>
      </div>
      <div class="mt-4 h-1.5 bg-ink-800 rounded-full overflow-hidden">
        <div id="workoutProgressBar" class="h-full bg-white transition-all duration-300" style="width:0%"></div>
      </div>
      <button onclick="resetWorkout()" class="mt-3 text-[11px] text-ink-500 hover:text-ink-300 font-medium transition">
        Recomeçar treino
      </button>
    </div>

    <!-- Aviso semanal -->
    <div class="bg-ink-900 border border-ink-800 rounded-2xl px-5 py-4 flex items-center gap-3">
      <svg class="w-4 h-4 text-ink-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-[11.5px] text-ink-300 leading-relaxed">
        Faça <strong class="text-white">1 dia do Treino A</strong> e <strong class="text-white">1 dia do Treino B</strong> por semana, com pelo menos 48 h entre eles.
      </p>
    </div>

    <!-- Lista de exercícios -->
    <div id="exercisesList" class="space-y-3"></div>
  </section>

  <!-- ============ ABA PROGRESSO ============ -->
  <section id="pane-progresso" class="pane hidden space-y-6">
    <!-- Resumo da semana -->
    <div class="bg-ink-900 border border-ink-800 rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-white">Progresso da semana</h2>
        <span id="weekBadge" class="text-xs font-mono font-bold text-ink-300">0/2 treinos</span>
      </div>
      <div class="h-1.5 bg-ink-800 rounded-full overflow-hidden">
        <div id="weekBar" class="h-full bg-white transition-all duration-300" style="width:0%"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-1">
        <div id="dayCard-0" class="rounded-lg border border-ink-800 bg-ink-950 p-4 transition">
          <div class="text-[10px] uppercase tracking-wider font-bold text-ink-500">Treino A</div>
          <div class="text-sm font-bold text-ink-300 mt-1" id="dayStatus-0">—</div>
        </div>
        <div id="dayCard-1" class="rounded-lg border border-ink-800 bg-ink-950 p-4 transition">
          <div class="text-[10px] uppercase tracking-wider font-bold text-ink-500">Treino B</div>
          <div class="text-sm font-bold text-ink-300 mt-1" id="dayStatus-1">—</div>
        </div>
      </div>
      <button onclick="resetWeek()" class="text-[11px] text-ink-500 hover:text-ink-300 font-medium transition">
        Recomeçar semana
      </button>
    </div>

    <!-- Registro de medidas -->
    <div class="bg-ink-900 border border-ink-800 rounded-2xl p-5 space-y-4">
      <div>
        <h2 class="text-base font-bold text-white">Registrar medidas</h2>
        <p class="text-xs text-ink-400 mt-1" id="measureHelp">Acompanhe sua evolução.</p>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-ink-300 mb-1.5">Peso (kg)</label>
          <input type="number" id="inWeight" step="0.1" inputmode="decimal" placeholder="0,0"

        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-ink-300 mb-1.5" id="lblMeasure1">Cintura (cm)</label>
            <input type="number" id="inMeasure1" step="0.5" inputmode="decimal" placeholder="0"
                   class="w-full bg-ink-950 border border-ink-800 rounded-xl px-4 py-3 text-white text-sm font-medium focus:border-ink-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-ink-300 mb-1.5" id="lblMeasure2">Quadril (cm)</label>
            <input type="number" id="inMeasure2" step="0.5" inputmode="decimal" placeholder="0"

          </div>
        </div>
        <button onclick="saveMeasurement()" class="w-full py-3 rounded-xl bg-white text-ink-950 font-bold text-sm hover:bg-ink-100 transition">
          Salvar registro
        </button>
      </div>
    </div>

    <!-- Histórico -->
    <div class="bg-ink-900 border border-ink-800 rounded-2xl overflow-hidden">
      <div class="px-5 py-4 flex items-center justify-between border-b border-ink-800">

        <span id="historyCount" class="text-xs text-ink-400 font-medium">0 registros</span>
      </div>
      <div id="historyList" class="divide-y divide-ink-800 max-h-96 overflow-y-auto"></div>
    </div>
  </section>

      <h2 class="text-base font-bold text-white" id="dietTitle">Alimentação</h2>
      <p class="text-xs text-ink-400 mt-1" id="dietSubtitle">—</p>
    </div>

    <div id="dietWarning"></div>

    <div class="grid grid-cols-2 gap-3" id="dietPillars"></div>

    <div class="space-y-3" id="dietMeals"></div>
  </section>

</main>

<!-- ================= TOAST ================= -->

</div>

/* ============================================================
   PERSISTÊNCIA
   ============================================================ */
function persist() {
  try {
    localStorage.setItem(K_PROFILE, profile);
    localStorage.setItem(K_DONE, JSON.stringify(done));
    localStorage.setItem(K_MEAS, JSON.stringify(measurements));
    localStorage.setItem(K_TS, String(Date.now()));
  } catch(e){}
}

function load() {
  try {
    const p = localStorage.getItem(K_PROFILE);
    if(p === 'homem' || p === 'mulher') profile = p;

    const d = JSON.parse(localStorage.getItem(K_DONE) || 'null');
    if(d) done = d;

    const m = JSON.parse(localStorage.getItem(K_MEAS) || 'null');
    if(m) measurements = m;

    const emb = document.getElementById('embedded-state');
    if(emb && emb.textContent.trim() !== 'null') {
      const e = JSON.parse(emb.textContent);
      if(e.profile) profile = e.profile;
      if(e.done) done = e.done;
      if(e.measurements) measurements = e.measurements;
    }
  } catch(e){}
}

/* ============================================================
   UI - PERFIL
   ============================================================ */
function setProfile(p) {
  profile = p;
  persist();
  updateProfileUI();
  renderWorkout();
  renderProgress();
  renderDiet();
}

function updateProfileUI() {
  const isH = profile === 'homem';

  ['homem', 'mulher'].forEach(pp => {
    const b = document.getElementById('prof-' + pp);
    if (pp === profile) {
      b.className = 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-ink-950 shadow-sm';
    } else {
      b.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-ink-400 hover:text-ink-200';
    }
  });

  document.getElementById('headerSub').textContent = isH
    ? 'Treino masculino · 2x por semana'
    : 'Treino feminino · 2x por semana';

  document.getElementById('measureHelp').textContent = isH
    ? 'A balança engana (músculo pesa mais que gordura). O que importa é a barriga na altura do umbigo diminuindo.'
    : 'A balança oscila com o ciclo. As medidas de cintura e quadril mostram a perda real de gordura.';

  document.getElementById('lblMeasure1').textContent = isH ? 'Barriga (cm)' : 'Cintura (cm)';
  document.getElementById('lblMeasure2').textContent = isH ? 'Peito (cm)' : 'Quadril (cm)';
}

/* ============================================================
   UI - TREINO
   ============================================================ */
function selectWorkout(i) {
  currentWorkout = i;
  renderWorkout();
}

function renderWorkout() {
  const w = TREINOS[profile][currentWorkout];

  document.getElementById('workoutLetter').textContent = 'Treino ' + w.letter;
  document.getElementById('workoutTitle').textContent = w.title;
  document.getElementById('workoutSubtitle').textContent = w.subtitle;

  // Botões A/B
  for (let i = 0; i < 2; i++) {
    const b = document.getElementById('wbtn-' + i);
    if (i === currentWorkout) {
      b.className = 'wbtn py-3 rounded-xl text-sm font-bold transition bg-white text-ink-950 shadow-sm';
    } else {
      b.className = 'wbtn py-3 rounded-xl text-sm font-bold transition bg-ink-900 text-ink-300 border border-ink-800 hover:border-ink-700 hover:text-white';
    }
  }

  const list = document.getElementById('exercisesList');
  list.innerHTML = '';

    const isDone = !!doneMap[idx];
    const card = document.createElement('div');
    card.className = `rounded-2xl border transition ${isDone ? 'bg-ink-900 border-ink-700' : 'bg-ink-900 border-ink-800'}`;

    card.innerHTML = `
      <div class="p-5">
        <div class="flex items-start gap-4">
          <button onclick="toggleExercise(${idx})"
                  class="mt-0.5 shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center transition ${isDone ? 'bg-white border-white' : 'bg-transparent border-ink-600 hover:border-ink-400'}">
            ${isDone ? '<svg class="w-4 h-4 text-ink-950" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
          </button>
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span class="text-[11px] font-mono font-bold text-ink-500">${String(idx + 1).padStart(2, '0')}</span>
              <h3 class="text-base font-bold ${isDone ? 'text-ink-400 line-through' : 'text-white'}">${ex.name}</h3>
            </div>
            <p class="text-[11px] text-ink-400 mt-0.5 font-medium">${ex.muscle}</p>
          </div>
        </div>

        <div class="mt-4 space-y-3 pl-10">
          <div>
            <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-1">Como posicionar</p>
            <p class="text-[13px] text-ink-200 leading-relaxed">${ex.how}</p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-1">Como executar</p>
            <p class="text-[13px] text-ink-200 leading-relaxed">${ex.do}</p>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div class="bg-ink-950 border border-ink-800 rounded-lg px-3 py-2">
              <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-0.5">Repetições</p>
              <p class="text-xs font-bold text-white">${ex.reps}</p>
            </div>
            <div class="bg-ink-950 border border-ink-800 rounded-lg px-3 py-2">
              <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-0.5">Peso inicial</p>
              <p class="text-xs font-bold text-white">${ex.peso}</p>
            </div>
            <div class="bg-ink-950 border border-ink-800 rounded-lg px-3 py-2">
              <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-0.5">Descanso</p>
              <p class="text-xs font-bold text-white">${ex.rest}</p>
            </div>
            <div class="bg-ink-950 border border-ink-800 rounded-lg px-3 py-2">
              <p class="text-[10px] uppercase tracking-wider font-bold text-ink-500 mb-0.5">Respiração</p>

            </div>

        </div>
      </div>`;
    list.appendChild(card);
  });

  updateWorkoutProgress();
}

function toggleExercise(idx) {
  if (!done[profile]) done[profile] = {};
  if (!done[profile][currentWorkout]) done[profile][currentWorkout] = {};

  done[profile][currentWorkout][idx] = !done[profile][currentWorkout][idx];
  persist();
  renderWorkout();
  renderProgress();
}

function resetWorkout() {
  if (!confirm('Recomeçar este treino do zero?')) return;
  if (done[profile]) done[profile][currentWorkout] = {};
  persist();
  renderWorkout();
  renderProgress();
}

function resetWeek() {
  if (!confirm('Recomeçar a semana (limpar tudo)?')) return;
  if (done[profile]) done[profile] = {};
  persist();
  renderWorkout();
  renderProgress();
}

function updateWorkoutProgress() {
  const w = TREINOS[profile][currentWorkout];
  const doneMap = done[profile]?.[currentWorkout] || {};
  let count = 0;
  w.exercises.forEach((_, i) => { if (doneMap[i]) count++; });

  document.getElementById('workoutProgressNum').textContent = `${count}/${w.exercises.length}`;
  const pct = Math.round((count / w.exercises.length) * 100);
  document.getElementById('workoutProgressBar').style.width = pct + '%';
}

/* ============================================================
   UI - PROGRESSO
   ============================================================ */
function renderProgress() {
  let completed = 0;
  for (let w = 0; w < 2; w++) {
    const ww = TREINOS[profile][w];
    const doneMap = done[profile]?.[w] || {};
    let c = 0;
    ww.exercises.forEach((_, i) => { if (doneMap[i]) c++; });

    const full = c === ww.exercises.length;
    if (full) completed++;

    const card = document.getElementById('dayCard-' + w);
    const status = document.getElementById('dayStatus-' + w);
    if (full) {
      card.className = 'rounded-lg border border-ink-600 bg-ink-800 p-4 transition';
      status.textContent = '✓ concluído';
      status.className = 'text-sm font-bold text-white mt-1';
    } else {
      card.className = 'rounded-lg border border-ink-800 bg-ink-950 p-4 transition';
      status.textContent = `${c}/${ww.exercises.length} exercícios`;
      status.className = 'text-sm font-bold text-ink-400 mt-1';
    }
  }

  document.getElementById('weekBadge').textContent = `${completed}/2 treinos`;
  document.getElementById('weekBar').style.width = ((completed / 2) * 100) + '%';

  // Histórico de medidas
  const list = document.getElementById('historyList');
  const logs = measurements[profile] || [];
  document.getElementById('historyCount').textContent = `${logs.length} registros`;

  if (logs.length === 0) {
    list.innerHTML = '<div class="px-5 py-8 text-center text-ink-500 text-xs">Nenhum registro ainda</div>';
  } else {
    list.innerHTML = [...logs].reverse().map(l => {
      const lbl1 = profile === 'homem' ? 'Barriga' : 'Cintura';
      const lbl2 = profile === 'homem' ? 'Peito' : 'Quadril';
      return `
        <div class="px-5 py-4 flex items-center justify-between gap-4">
          <div>
            <p class="text-xs font-semibold text-white">${l.date}</p>
            <p class="text-[11px] text-ink-500 mt-0.5">${l.notes || '—'}</p>
          </div>
          <div class="text-right">
            <p class="text-sm font-bold text-white">${Number(l.weight).toFixed(1)} kg</p>
            <p class="text-[11px] text-ink-400 mt-0.5">
              ${l.m1 ? lbl1 + ' ' + l.m1 + ' cm' : ''}${l.m1 && l.m2 ? ' · ' : ''}${l.m2 ? lbl2 + ' ' + l.m2 + ' cm' : ''}
            </p>
          </div>
        </div>`;
    }).join('');
  }
}

function saveMeasurement() {
  const w = parseFloat(document.getElementById('inWeight').value);
  const m1 = parseFloat(document.getElementById('inMeasure1').value);
  const m2 = parseFloat(document.getElementById('inMeasure2').value);

  if (!w || isNaN(w)) { showToast('Informe o peso'); return; }

  if (!measurements[profile]) measurements[profile] = [];
  measurements[profile].push({
    date: new Date().toLocaleDateString('pt-BR'),
    weight: w,
    m1: m1 || null,
    m2: m2 || null,
    notes: ''
  });

  document.getElementById('inWeight').value = '';
  document.getElementById('inMeasure1').value = '';
  document.getElementById('inMeasure2').value = '';

  persist();
  renderProgress();
  showToast('Registro salvo');
}

/* ============================================================
   UI - ABAS
   ============================================================ */
function switchTab(tab) {
  ['treinos', 'progresso', 'dieta'].forEach(t => {
    document.getElementById('pane-' + t).classList.add('hidden');
    const btn = document.getElementById('tab-btn-' + t);
    btn.className = 'tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition text-ink-400 hover:text-white';
  });

  document.getElementById('pane-' + tab).classList.remove('hidden');
  document.getElementById('tab-btn-' + tab).className =
    'tab-btn shrink-0 px-4 py-2 rounded-lg text-sm font-bold transition bg-ink-800 text-white border border-ink-700';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translate(-50%, -8px)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%, 0)';
  }, 2200);
}

/* ============================================================
   SALVAR HTML
   ============================================================ */
function downloadHtmlWithState() {
  const state = {
    profile,
    done,
    measurements,
    timestamp: Date.now()
  };
  const str = JSON.stringify(state).replace(/</g, '\\u003c');

  const el = document.getElementById('embedded-state');
  if (el) el.textContent = str;

  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const updated = html.replace(
    /(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,
    `$1${str}$2`
  );

  const blob = new Blob([updated], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'meus-treinos.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('Arquivo salvo');
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  load();
  updateProfileUI();
  switchTab('treinos');
  renderWorkout();

  renderDiet();
});
